name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  runtime:
    name: runtime (bun)
    runs-on: ubicloud-standard-2
    defaults:
      run:
        working-directory: packages/solid-layouts
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - run: bun install

      # `bun test` is not enough on its own. Solid ships separate client and
      # server builds behind export conditions, and Bun resolves the server one
      # by default, under which effects run once and signals never propagate.
      # Every reactivity assertion would pass while testing nothing. The
      # package's `test` script carries `--conditions=browser` for this reason,
      # so invoke it rather than calling `bun test` directly.
      - run: bun run test

      - run: bunx tsc --noEmit

      - name: Build and load the package entry
        run: bun run build && bun -e 'await import("./dist/index.js")'

  parity:
    name: parity (compiled == interpreted)
    runs-on: ubicloud-standard-2
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/solid-layouts-oxc

      # `parity.compiled.ts` is generated by the Rust compiler and checked in,
      # so the TypeScript suite can compare both resolution paths without
      # invoking cargo. Regenerating it here catches the case where someone
      # changes the emitter and does not refresh the fixture: the suite would
      # otherwise keep comparing against a stale table and stay green while the
      # two implementations drifted apart.
      - name: Regenerate the parity fixture
        working-directory: packages/solid-layouts-oxc
        run: |
          cargo run -q -p layouts-transform --example compile -- \
            ../solid-layouts/src/__parity__/parity.recipe.ts \
            | sed 's/export const parity =/export const parityCompiled =/' \
            > ../solid-layouts/src/__parity__/parity.compiled.ts

      - name: Fail if the checked-in fixture was stale
        run: git diff --exit-code -- packages/solid-layouts/src/__parity__/parity.compiled.ts

      - working-directory: packages/solid-layouts
        run: bun install && bun run test

  pass:
    name: pass (cargo)
    runs-on: ubicloud-standard-2
    defaults:
      run:
        working-directory: packages/solid-layouts-oxc
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/solid-layouts-oxc

      # No `--features napi` anywhere here, deliberately. The binding is opt-in
      # so the transform builds and tests as pure Rust, and CI proving that is
      # what keeps it true.
      - run: cargo fmt --all --check

      - run: cargo clippy --workspace --all-targets -- -D warnings

      # Runs the conformance corpus in `fixtures/` as well as the unit tests.
      - run: cargo test --workspace

  compiler-hosts:
    name: compiler hosts (bun + native binding)
    runs-on: ubicloud-standard-2
    defaults:
      run:
        working-directory: packages/solid-layouts-oxc
    steps:
      - uses: actions/checkout@v4

      - name: Check out the pinned upstream Solid JSX corpus
        uses: actions/checkout@v4
        with:
          repository: ryansolid/dom-expressions
          ref: 062d23cc29731e8c2281ddfa36188d438a90e21f
          path: upstream/dom-expressions
          sparse-checkout: packages/babel-plugin-jsx-dom-expressions/test
          sparse-checkout-cone-mode: false

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/solid-layouts-oxc

      - name: Build the local native binding
        run: ./scripts/build-binding.sh

      - name: Test the library compiler host
        run: bun run test:library

      # The application host resolves a consumer's declared runtime by reading
      # `solid-layouts`'s built entry off disk, so the runtime has to exist
      # before these run. Without this the job fails on a missing
      # `packages/solid-layouts/dist/index.js`, which reads as a broken
      # resolver rather than an unbuilt dependency.
      - name: Build the runtime the application host resolves against
        working-directory: packages/solid-layouts
        run: bun install --frozen-lockfile && bun run build

      - name: Test the application compiler host
        run: bun run test:application

      - name: Test the upstream Solid JSX corpus
        env:
          DOM_EXPRESSIONS_FIXTURES: ${{ github.workspace }}/upstream/dom-expressions/packages/babel-plugin-jsx-dom-expressions/test
        run: bun run test:upstream-solid

      - name: Regenerate the four-component package fixture
        working-directory: Test-UI
        run: bun ../packages/solid-layouts-oxc/bin/solid-layouts-library.js

      - name: Fail if the checked-in package fixture was stale
        working-directory: .
        run: git diff --exit-code -- Test-UI/bundle

  solid-2-consumer:
    name: solid 2 consumer (rspack links it)
    runs-on: ubicloud-standard-2
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      # The package is developed against an installed Solid 1.9, so every other
      # job type-checks and runs the 2.0 sources against the wrong major. This
      # one installs Solid 2 for real and asks a bundler to link the 2.0 entry.
      #
      # It exists because the bug it guards is a *link* error, invisible to a
      # runtime check: the conditional it came from picked the correct arm when
      # executed and still could not be bundled, because a bundler resolves
      # both arms against the installed Solid. Verified by reintroducing that
      # conditional, which fails this job with the original message:
      #
      #   ESModulesLinkingError: export 'splitProps' (imported as 'solid') was
      #   not found in 'solid-js'
      - name: Build the package
        working-directory: packages/solid-layouts
        run: bun install && bun run build

      - name: Bundle a Solid 2 consumer through rspack
        working-directory: fixtures/solid-2-consumer
        run: bun install && bun run bundle
