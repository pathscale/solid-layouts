name: Release Solid Layouts JavaScript packages

# A version bump is the release. Landing a bump on master publishes that
# package, and a push that changes no version does nothing, so the number in
# package.json stays the thing a human decided rather than something a bot
# inferred. Tags still work for an explicit or a repeat release.
on:
  push:
    branches: [master]
    tags:
      - "solid-layouts-v*"
      - "rsbuild-plugin-solid-layouts-v*"
      - "pathscale-test-ui-v*"
  workflow_dispatch:
    inputs:
      package:
        description: Build a bootstrap artifact without publishing
        required: true
        type: choice
        options:
          - solid-layouts
          - rsbuild-plugin-solid-layouts
          - pathscale-test-ui

permissions:
  contents: read

jobs:
  decide:
    name: decide
    runs-on: ubicloud-standard-2
    outputs:
      packages: ${{ steps.decide.outputs.packages }}
      publish: ${{ steps.decide.outputs.publish }}
      any: ${{ steps.decide.outputs.any }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Decide which packages this push releases
        id: decide
        env:
          REQUESTED_PACKAGE: ${{ inputs.package }}
        run: |
          node --input-type=commonjs -e '
            const { execFileSync } = require("node:child_process");
            const { appendFileSync, readFileSync } = require("node:fs");

            // `auto` marks the packages a version bump on master releases.
            // pathscale-test-ui is a private fixture, so it ships only when a
            // tag or a dispatch names it.
            const known = [
              { name: "solid-layouts", directory: "packages/solid-layouts", auto: true },
              { name: "rsbuild-plugin-solid-layouts", directory: "packages/rsbuild-plugin-solid-layouts", auto: true },
              { name: "pathscale-test-ui", directory: "Test-UI/bundle", auto: false },
            ];
            const versionOf = (p) =>
              JSON.parse(readFileSync(`${p.directory}/package.json`, "utf8")).version;
            const publishedNameOf = (p) =>
              JSON.parse(readFileSync(`${p.directory}/package.json`, "utf8")).name;

            const out = (key, value) => appendFileSync(process.env.GITHUB_OUTPUT, `${key}=${value}\n`);
            const emit = (selected, publish) => {
              out("packages", JSON.stringify(selected));
              out("publish", String(publish));
              out("any", String(selected.length > 0));
            };

            const refType = process.env.GITHUB_REF_TYPE;
            const refName = process.env.GITHUB_REF_NAME;

            if (refType === "tag") {
              const match = known.find((p) => refName.startsWith(`${p.name}-v`));
              if (!match) {
                console.log(`::error::no package matches tag ${refName}`);
                process.exit(1);
              }
              const version = versionOf(match);
              const expected = `${match.name}-v${version}`;
              if (refName !== expected) {
                console.log(`::error::expected tag ${expected}, received ${refName}`);
                process.exit(1);
              }
              emit([{ ...match, version }], true);
              process.exit(0);
            }

            if (process.env.GITHUB_EVENT_NAME === "workflow_dispatch") {
              const match = known.find((p) => p.name === process.env.REQUESTED_PACKAGE);
              if (!match) {
                console.log(`::error::unknown package ${process.env.REQUESTED_PACKAGE}`);
                process.exit(1);
              }
              emit([{ ...match, version: versionOf(match) }], false);
              process.exit(0);
            }

            // npm is the source of truth rather than the diff, so a rerun or a
            // publish that failed half way is safe to repeat, and a merge that
            // touched no version costs nothing.
            const selected = [];
            for (const p of known.filter((p) => p.auto)) {
              const version = versionOf(p);
              const published = publishedNameOf(p);
              let onNpm = true;
              try {
                execFileSync("npm", ["view", `${published}@${version}`, "version"], { stdio: "ignore" });
              } catch {
                onNpm = false;
              }
              if (onNpm) {
                console.log(`::notice::${published} ${version} is already on npm`);
              } else {
                console.log(`::notice::releasing ${published} ${version}`);
                selected.push({ ...p, version });
              }
            }
            emit(selected, selected.length > 0);
          '

  package:
    needs: decide
    if: needs.decide.outputs.any == 'true'
    runs-on: ubicloud-standard-2
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.decide.outputs.packages) }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install runtime build dependencies
        if: matrix.package.directory == 'packages/solid-layouts'
        working-directory: packages/solid-layouts
        run: bun install --frozen-lockfile

      - name: Pack
        working-directory: ${{ matrix.package.directory }}
        run: |
          mkdir -p "$RUNNER_TEMP/npm-package"
          npm pack --pack-destination "$RUNNER_TEMP/npm-package"

      - uses: actions/upload-artifact@v4
        with:
          name: npm-package-${{ matrix.package.name }}
          path: ${{ runner.temp }}/npm-package/*.tgz
          if-no-files-found: error

  publish:
    needs: [decide, package]
    if: needs.decide.outputs.publish == 'true'
    runs-on: ubicloud-standard-2
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.decide.outputs.packages) }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: npm-package-${{ matrix.package.name }}
          path: npm-package

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Require npm with OIDC support
        run: |
          npm_version="$(npm --version)"
          node -e '
            const [major, minor, patch = 0] = process.argv[1].split(".").map(Number);
            if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) process.exit(1);
          ' "$npm_version" || {
            echo "npm 11.5.1 or newer is required for Trusted Publishing; found $npm_version"
            exit 1
          }

      - name: Publish
        run: npm publish ./npm-package/*.tgz --access public
