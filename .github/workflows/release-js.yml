name: Release Solid Layouts JavaScript packages

on:
  push:
    tags:
      - "solid-layouts-v*"
      - "rsbuild-plugin-solid-layouts-v*"
      - "pathscale-test-ui-v*"
  workflow_dispatch:
    inputs:
      package:
        description: Build a bootstrap artifact without publishing
        required: true
        type: choice
        options:
          - solid-layouts
          - rsbuild-plugin-solid-layouts
          - pathscale-test-ui

permissions:
  contents: read

jobs:
  package:
    runs-on: ubicloud-standard-2
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Select package
        id: package
        shell: bash
        env:
          REQUESTED_PACKAGE: ${{ inputs.package }}
        run: |
          selector="${REQUESTED_PACKAGE:-$GITHUB_REF_NAME}"
          case "$selector" in
            solid-layouts|solid-layouts-v*)
              echo "directory=packages/solid-layouts" >> "$GITHUB_OUTPUT"
              echo "tag-prefix=solid-layouts" >> "$GITHUB_OUTPUT"
              ;;
            rsbuild-plugin-solid-layouts|rsbuild-plugin-solid-layouts-v*)
              echo "directory=packages/rsbuild-plugin-solid-layouts" >> "$GITHUB_OUTPUT"
              echo "tag-prefix=rsbuild-plugin-solid-layouts" >> "$GITHUB_OUTPUT"
              ;;
            pathscale-test-ui|pathscale-test-ui-v*)
              echo "directory=Test-UI/bundle" >> "$GITHUB_OUTPUT"
              echo "tag-prefix=pathscale-test-ui" >> "$GITHUB_OUTPUT"
              ;;
            *) exit 1 ;;
          esac

      - name: Match release tag to package version
        if: github.event_name == 'push'
        working-directory: ${{ steps.package.outputs.directory }}
        env:
          TAG_PREFIX: ${{ steps.package.outputs.tag-prefix }}
        run: |
          version="$(node -p "require('./package.json').version")"
          expected="$TAG_PREFIX-v$version"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "expected tag $expected, received $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Install runtime build dependencies
        if: steps.package.outputs.directory == 'packages/solid-layouts'
        working-directory: packages/solid-layouts
        run: bun install --frozen-lockfile

      - name: Pack
        working-directory: ${{ steps.package.outputs.directory }}
        run: |
          mkdir -p "$RUNNER_TEMP/npm-package"
          npm pack --pack-destination "$RUNNER_TEMP/npm-package"

      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: ${{ runner.temp }}/npm-package/*.tgz
          if-no-files-found: error

  publish:
    needs: package
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: npm-package

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Require npm with OIDC support
        run: |
          npm_version="$(npm --version)"
          node -e '
            const [major, minor, patch = 0] = process.argv[1].split(".").map(Number);
            if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) process.exit(1);
          ' "$npm_version" || {
            echo "npm 11.5.1 or newer is required for Trusted Publishing; found $npm_version"
            exit 1
          }

      - name: Publish
        run: npm publish ./npm-package/*.tgz --access public
