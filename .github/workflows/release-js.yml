name: Release Solid Layouts JavaScript packages

on:
  push:
    tags:
      - "solid-layouts-v*"
      - "rsbuild-plugin-solid-layouts-v*"
      - "pathscale-test-ui-v*"

permissions:
  contents: read
  id-token: write

jobs:
  package:
    runs-on: ubicloud-standard-2
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Select package
        id: package
        shell: bash
        run: |
          case "${GITHUB_REF_NAME}" in
            solid-layouts-v*) echo "directory=packages/solid-layouts" >> "$GITHUB_OUTPUT" ;;
            rsbuild-plugin-solid-layouts-v*) echo "directory=packages/rsbuild-plugin-solid-layouts" >> "$GITHUB_OUTPUT" ;;
            pathscale-test-ui-v*) echo "directory=Test-UI/bundle" >> "$GITHUB_OUTPUT" ;;
            *) exit 1 ;;
          esac

      - name: Install runtime build dependencies
        if: startsWith(github.ref_name, 'solid-layouts-v')
        working-directory: packages/solid-layouts
        run: bun install --frozen-lockfile

      - name: Pack
        working-directory: ${{ steps.package.outputs.directory }}
        run: |
          mkdir -p "$RUNNER_TEMP/npm-package"
          npm pack --pack-destination "$RUNNER_TEMP/npm-package"

      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: ${{ runner.temp }}/npm-package/*.tgz
          if-no-files-found: error

  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: npm-package

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Publish
        run: npm publish npm-package/*.tgz --access public --provenance
