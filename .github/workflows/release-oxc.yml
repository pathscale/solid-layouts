name: Release solid-layouts-oxc

# A native package cannot be published from one machine: the tarball has to
# carry a binary per platform, and a macOS laptop can build exactly one of
# them. Publishing from here rather than locally is what stops a version being
# burned on an artifact that fails on first install under Linux.
#
# A version bump is the release. Landing a bump on master publishes it, and a
# push that does not change the version does nothing, so the number in
# package.json stays the thing a human decided rather than something a bot
# inferred. Tags still work for an explicit or a repeat release.
on:
  push:
    branches: [master]
    tags:
      - "solid-layouts-oxc-v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  decide:
    name: decide
    runs-on: ubicloud-standard-2
    outputs:
      build: ${{ steps.decide.outputs.build }}
      publish: ${{ steps.decide.outputs.publish }}
      version: ${{ steps.decide.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Decide whether this push is a release
        id: decide
        working-directory: packages/solid-layouts-oxc
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          # A tag names the version it releases, and disagreeing with
          # package.json is a mistake worth failing on rather than guessing at.
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            expected="solid-layouts-oxc-v$version"
            if [ "$GITHUB_REF_NAME" != "$expected" ]; then
              echo "expected tag $expected, received $GITHUB_REF_NAME"
              exit 1
            fi
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Dispatch is the bootstrap path: build the artifact, publish nothing.
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::building $version without publishing"
            exit 0
          fi

          # npm is the source of truth rather than the diff, so a rerun or a
          # publish that failed half way is safe to repeat and a merge that
          # touched no version costs nothing.
          if npm view "solid-layouts-oxc@$version" version >/dev/null 2>&1; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::solid-layouts-oxc $version is already on npm"
            exit 0
          fi

          echo "build=true" >> "$GITHUB_OUTPUT"
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "::notice::releasing solid-layouts-oxc $version"

  build:
    name: ${{ matrix.target }}
    needs: decide
    if: needs.decide.outputs.build == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux runs on Ubicloud; macOS has to be GitHub-hosted because
          # Ubicloud has no macOS runners.
          - target: x86_64-unknown-linux-gnu
            runner: ubicloud-standard-4
          - target: aarch64-unknown-linux-gnu
            runner: ubicloud-standard-4-arm
          - target: aarch64-apple-darwin
            runner: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: oven-sh/setup-bun@v2

      - name: Build
        working-directory: packages/solid-layouts-oxc
        run: |
          cargo build --release --features napi --target ${{ matrix.target }}

      - name: Name the binary as the loader expects
        working-directory: packages/solid-layouts-oxc
        shell: bash
        run: |
          case "${{ matrix.target }}" in
            x86_64-unknown-linux-gnu)  name=linux-x64-gnu;   lib=libsolid_layouts_oxc.so ;;
            aarch64-unknown-linux-gnu) name=linux-arm64-gnu; lib=libsolid_layouts_oxc.so ;;
            aarch64-apple-darwin)      name=darwin-arm64;    lib=libsolid_layouts_oxc.dylib ;;
          esac
          cp "target/${{ matrix.target }}/release/$lib" "solid-layouts-oxc.$name.node"

      - name: Prove it loads and transforms
        working-directory: packages/solid-layouts-oxc
        # Cross-built artifacts cannot run on the builder, so this only checks
        # the ones native to the runner. A binary that never loads is worse
        # than one that never built.
        if: matrix.target != 'aarch64-unknown-linux-gnu'
        run: |
          bun -e '
            const { transform } = require("./index.js");
            const out = transform(
              `import { recipe } from "solid-layouts";
               export const r = recipe({ component: "r", element: "div", slots: { root: { base: "r" } } });`,
              "/x/R.recipe.ts",
              { mode: "library" },
            );
            if (!out.code.includes("_layouts")) throw new Error("the pass did not emit");
            console.log("ok");
          '

      - uses: actions/upload-artifact@v4
        with:
          name: binding-${{ matrix.target }}
          path: packages/solid-layouts-oxc/*.node

  package:
    needs: [decide, build]
    runs-on: ubicloud-standard-2
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          path: packages/solid-layouts-oxc
          merge-multiple: true

      - name: Refuse to publish a partial set
        working-directory: packages/solid-layouts-oxc
        run: |
          count=$(ls *.node | wc -l)
          if [ "$count" -ne 3 ]; then
            echo "expected three bindings, found $count:"; ls *.node
            exit 1
          fi

      - name: Pack
        working-directory: packages/solid-layouts-oxc
        run: |
          mkdir -p "$RUNNER_TEMP/npm-package"
          npm pack --pack-destination "$RUNNER_TEMP/npm-package"

      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: ${{ runner.temp }}/npm-package/*.tgz
          if-no-files-found: error

  publish:
    needs: [decide, package]
    if: needs.decide.outputs.publish == 'true'
    runs-on: ubicloud-standard-2
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: npm-package

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Require npm with OIDC support
        run: |
          npm_version="$(npm --version)"
          node -e '
            const [major, minor, patch = 0] = process.argv[1].split(".").map(Number);
            if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) process.exit(1);
          ' "$npm_version" || {
            echo "npm 11.5.1 or newer is required for Trusted Publishing; found $npm_version"
            exit 1
          }

      - name: Publish
        run: npm publish ./npm-package/*.tgz --access public
